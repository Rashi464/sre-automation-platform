apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ .Release.Name }}-order-service

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: order-service

  template:
    metadata:
      labels:
        app: order-service

    spec:
      containers:
        - name: order-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.service.targetPort }}

          env:
            - name: APP_NAME
              value: {{ .Values.environment.APP_NAME | quote }}

            - name: APP_VERSION
              value: {{ .Values.environment.APP_VERSION | quote }}

            - name: ENVIRONMENT
              value: {{ .Values.environment.ENVIRONMENT | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 20