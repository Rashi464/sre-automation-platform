name: Grafana Validation

'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  grafana-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate dashboard JSON
        run: python -m json.tool monitoring/grafana/dashboard.json

      - name: Install yamllint
        run: python -m pip install yamllint

      - name: Validate Grafana YAML
        run: yamllint -d relaxed kubernetes/grafana-deployment.yaml kubernetes/grafana-service.yaml kubernetes/grafana-configmap.yaml