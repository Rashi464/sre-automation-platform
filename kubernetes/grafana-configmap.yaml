apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alert-rules.yml

    scrape_configs:
      - job_name: order-service
        metrics_path: /metrics
        static_configs:
          - targets:
              - order-service:80

  alert-rules.yml: |
    groups:
      - name: order-service-alerts
        rules:
          - alert: OrderServiceHighErrorRate
            expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: Order service has a high error rate
              description: The order service is returning more than 5% HTTP 5xx responses.

          - alert: OrderServiceHighLatency
            expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
            for: 2m
            labels:
              severity: warning
            annotations:
              summary: Order service latency is high
              description: The 95th percentile request latency is above 1 second.

          - alert: OrderServiceUnavailable
            expr: up{job="order-service"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: Order service is unavailable
              description: Prometheus cannot scrape the order service.